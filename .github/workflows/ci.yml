name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: |
          echo "🔍 Running security audit..."
          npm audit --audit-level=high --json > audit.json || true

          # Check audit results, filtering out Prisma dev dependencies
          node -p "
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const allowList = ['hono', '@prisma/dev', 'prisma'];
            const prodVulns = Object.entries(audit.vulnerabilities || {})
              .filter(([name]) => !allowList.includes(name));
            const prismaIssues = Object.keys(audit.vulnerabilities || {})
              .filter(name => allowList.includes(name));

            if (prodVulns.length > 0) {
              console.error('❌ Security vulnerabilities in production:');
              prodVulns.forEach(([name, data]) =>
                console.error('  - ' + name + ': ' + data.severity)
              );
              process.exit(1);
            }
            console.log('✅ No production security vulnerabilities');
            if (prismaIssues.length > 0) {
              console.log('ℹ️  Dev-only: ' + prismaIssues.join(', '));
            }
          "

          rm audit.json

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
