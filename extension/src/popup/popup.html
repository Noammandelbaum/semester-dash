<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemesterHub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">SemesterHub</span>
      </div>
    </header>

    <!-- Main Content -->
    <section class="section main-section">
      <p class="info-text">נהל את הקורסים והמשימות שלך מ-Moodle</p>

      <button id="open-app-btn" class="btn btn-primary">
        פתח את SemesterHub
      </button>

      <div id="last-sync" class="last-sync hidden">
        <span>סנכרון אחרון:</span>
        <span id="last-sync-time">-</span>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-links">
        <a id="privacy-link" href="#" class="footer-link">מדיניות פרטיות</a>
        <span class="separator">|</span>
        <a id="terms-link" href="#" class="footer-link">תנאי שימוש</a>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
